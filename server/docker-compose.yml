services:
  server:
    build: .
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "rtc:"
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
      PROJECTS: '[{"projectId":"app1","apiKey":"api-key-app1","jwtSecret":"super-secret-jwt-1"},{"projectId":"app2","apiKey":"api-key-app2","jwtSecret":"super-secret-jwt-2"}]'
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
